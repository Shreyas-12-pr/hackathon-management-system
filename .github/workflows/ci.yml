  backend:
    name: Backend Checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi "uvicorn[standard]" sqlalchemy alembic asyncpg python-dotenv "psycopg[binary]" email-validator pytest

      - name: Check Python imports
        run: |
          python -c "from app.main import app; print('FastAPI application import successful')"

      - name: Run tests
        run: |
          if [ -d tests ] && [ "$(find tests -name 'test_*.py')" ]; then
            pytest
          else
            echo "No backend tests found yet."
          fi